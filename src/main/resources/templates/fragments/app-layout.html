<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, pageTitle, area, activePage)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#395E14">
  <title th:text="|PICUS · ${pageTitle}|">PICUS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/picus.css}" href="/css/picus.css">
  <script defer th:src="@{/js/picus-layout.js}" src="/js/picus-layout.js"></script>
  <script defer th:if="${area == 'OPT' and activePage == 'requests'}"
          th:src="@{/js/picus-opt-requests.js}" src="/js/picus-opt-requests.js"></script>
  <script defer th:if="${area == 'BANCO'}"
          th:src="@{/js/picus-banco.js}" src="/js/picus-banco.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Vai al contenuto</a>
  <header class="topbar" aria-label="Barra superiore">
    <div class="topbar-start">
      <button class="icon-button mobile-menu" id="openMenu" type="button" aria-label="Apri menu" title="Apri menu" aria-controls="sidebar" aria-expanded="false">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="icon-button desktop-menu" id="collapseMenu" type="button" aria-label="Comprimi menu laterale" aria-controls="sidebar" aria-expanded="true" title="Comprimi o espandi menu">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
      </button>
      <div class="brand" aria-label="PICUS — Banco Alimentare Campania">
        <span class="brand-picus">PICUS</span>
        <span class="brand-separator" aria-hidden="true"></span>
        <img class="bank-logo" th:src="@{/assets/banco-alimentare.svg}" src="/assets/banco-alimentare.svg" alt="Banco Alimentare">
      </div>
      <span class="area-tag" th:text="${area == 'OPT' ? 'Area OPT' : 'Area Banco'}">Area OPT</span>
    </div>
    <div class="account" aria-label="Profilo corrente">
      <span class="account-avatar" aria-hidden="true" th:text="${area == 'OPT' ? 'OP' : 'BA'}">OP</span>
      <span class="account-meta">
        <strong th:text="${accountName != null ? accountName : 'Utente'}">Utente</strong>
        <small th:text="${area == 'OPT' ? 'Area OPT' : 'Area Banco'}">Area OPT</small>
      </span>
    </div>
  </header>

  <div class="mobile-backdrop" id="menuBackdrop" hidden></div>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" th:attr="aria-label=|Menu area ${area}|">
      <div class="sidebar-inner">
        <nav class="sidebar-nav" aria-label="Navigazione">
          <p class="sidebar-section">Gestione richieste</p>
          <th:block th:if="${area == 'OPT'}">
            <a class="nav-item" th:href="@{/opt/requests}" href="/opt/requests"
               th:classappend="${activePage == 'requests'} ? 'active' : ''"
               th:attr="aria-current=${activePage == 'requests'} ? 'page' : null" title="Le mie richieste">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
              <span class="nav-label">Le mie richieste</span>
            </a>
            <a class="nav-item" th:href="@{/opt/requests/new}" href="/opt/requests/new"
               th:classappend="${activePage == 'new'} ? 'active' : ''"
               th:attr="aria-current=${activePage == 'new'} ? 'page' : null" title="Nuova richiesta">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
              <span class="nav-label">Nuova richiesta</span>
            </a>
          </th:block>
          <th:block th:if="${area == 'BANCO'}">
            <a class="nav-item" th:href="@{/banco/requests}" href="/banco/requests"
               th:classappend="${activePage == 'requests'} ? 'active' : ''"
               th:attr="aria-current=${activePage == 'requests'} ? 'page' : null" title="Richieste ricevute">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
              <span class="nav-label">Richieste ricevute</span>
            </a>
          </th:block>
        </nav>
        <div class="sidebar-footer">
          <form class="logout-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="nav-item logout-button" type="submit" aria-label="Esci">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M12 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/></svg>
              <span class="nav-label">Esci</span>
            </button>
          </form>
        </div>
      </div>
    </aside>

    <!-- Il contenuto della pagina viene sostituito dal fragment passato dalla vista. -->
    <main class="main" id="main-content" tabindex="-1" th:replace="${content}">
      <div class="content"><h1 th:text="${pageTitle}">Pagina PICUS</h1></div>
    </main>
  </div>
</body>
</html>
