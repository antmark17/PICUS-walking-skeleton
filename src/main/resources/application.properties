# Configurazione esclusiva di sviluppo locale / Walking Skeleton.
spring.application.name=picus-walking-skeleton
server.port=8080
spring.datasource.url=jdbc:h2:file:./picus-dev;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
server.error.include-message=never
# Nessun utente demo e nessuna misura pre-caricati in questa baseline.
